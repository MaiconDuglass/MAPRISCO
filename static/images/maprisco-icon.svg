<svg width="100" height="120" viewBox="0 0 100 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title">
  <title>MAPRISCO</title>
  <defs>
    <linearGradient id="pin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8fe03a" />
      <stop offset="100%" stop-color="#3f9a2a" />
    </linearGradient>
    <linearGradient id="wave1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5cc8fa" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="wave2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2b8fe0" />
      <stop offset="100%" stop-color="#1d63b8" />
    </linearGradient>
    <clipPath id="inner">
      <circle cx="50" cy="46" r="31" />
    </clipPath>
  </defs>
  <!-- Pino -->
  <path d="M50 116 C38 98 6 78 6 46 A44 44 0 1 1 94 46 C94 78 62 98 50 116 Z" fill="url(#pin)" />
  <!-- Círculo interno -->
  <circle cx="50" cy="46" r="33" fill="#ffffff" />
  <g clip-path="url(#inner)">
    <rect x="17" y="13" width="66" height="66" fill="#f4f9ff" />
    <!-- Sol -->
    <circle cx="64" cy="30" r="7" fill="#fbbf24" />
    <!-- Água -->
    <path d="M15 52 Q28 44 40 50 T64 50 T88 47 V82 H15 Z" fill="url(#wave1)" />
    <path d="M15 62 Q30 55 44 61 T72 59 T88 57 V82 H15 Z" fill="url(#wave2)" />
  </g>
  <!-- Níveis de risco (vermelho, laranja, verde) -->
  <rect x="25" y="25" width="9" height="5" rx="2.5" fill="#ef4444" />
  <rect x="25" y="32" width="9" height="5" rx="2.5" fill="#f59e0b" />
  <rect x="25" y="39" width="9" height="5" rx="2.5" fill="#22c55e" />
</svg>
